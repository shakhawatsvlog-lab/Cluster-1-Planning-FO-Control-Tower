<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alex Apparels — Redirecting</title>
    <script>
      (function () {
        var base = '/Cluster-1-Planning-FO-Control-Tower';
        var path = window.location.pathname || '/';
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        if (path.indexOf(base) === 0) {
          var sub = path.slice(base.length) || '/';
          var target = base + '/?p=' + encodeURIComponent(sub + search + hash);
          window.location.replace(target);
        } else {
          window.location.replace('/?p=' + encodeURIComponent(path + search + hash));
        }
      })();
    </script>
  </head>
  <body></body>
</html>
