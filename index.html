<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alex Planner" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>Alex Apparels — Cluster 1 Planning &amp; FO Control Tower</title>
    <meta
      name="description"
      content="Alex Apparels production planning portal, fabric order tracker, daily cutting entry, automated daily FO email reminders, and Excel dashboard workbook for ALEX 1, ALEX 3, ALEX 5, and ALEX 12."
    />
    <meta property="og:title" content="Alex Apparels — Cluster 1 Planning &amp; FO Control Tower" />
    <meta
      property="og:description"
      content="Production planning portal, fabric order tracker, daily cutting log, automated daily FO email reminders, and Excel workbook export for ALEX 1, ALEX 3, ALEX 5, and ALEX 12."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900">
    <script>
      (function () {
        try {
          var base = '/Cluster-1-Planning-FO-Control-Tower';
          var rawPath = window.location.pathname || '/';
          var params = new URLSearchParams(window.location.search || '');
          var pending = params.get('p');
          var checkPath = pending && pending.charAt(0) === '/' ? pending.split('?')[0] : rawPath;
          var hasBase = rawPath === base || rawPath.indexOf(base + '/') === 0;
          var stripped = (checkPath.indexOf(base) === 0 ? checkPath.slice(base.length) : checkPath)
            .replace(/\/+$/, '')
            .toLowerCase();
          if (stripped === '/master-plan' || stripped.indexOf('/master-plan/') === 0) {
            var manifestHref = hasBase ? base + '/master-plan.webmanifest' : '/master-plan.webmanifest';
            var manifestLink = document.querySelector('link[rel="manifest"]');
            if (manifestLink) {
              manifestLink.setAttribute('href', manifestHref);
            } else {
              manifestLink = document.createElement('link');
              manifestLink.rel = 'manifest';
              manifestLink.href = manifestHref;
              document.head.appendChild(manifestLink);
            }
            document.title = 'Alpine Master Plan';
            var appTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appTitle) appTitle.setAttribute('content', 'Master Plan');
            var themeMeta = document.querySelector('meta[name="theme-color"]');
            if (themeMeta) themeMeta.setAttribute('content', '#0a1633');
            var touchIcon = document.querySelector('link[rel="apple-touch-icon"]');
            if (touchIcon) touchIcon.setAttribute('href', base + '/master-plan-apple-touch-icon.png');
            var favIcon = document.querySelector('link[rel="icon"]');
            if (favIcon) favIcon.setAttribute('href', base + '/master-plan-icon.svg');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
